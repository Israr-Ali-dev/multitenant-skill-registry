services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-postgres-password}
      POSTGRES_DB: ${POSTGRES_DB:-skill_registry}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-skill_registry}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - ADMIN_DATABASE_URL=${ADMIN_DATABASE_URL:-postgresql+asyncpg://postgres:changeme-postgres-password@postgres:5432/skill_registry}
    command: ["alembic", "upgrade", "head"]

  seed:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://app_role:changeme-app-role-password@postgres:5432/skill_registry}
      - ADMIN_DATABASE_URL=${ADMIN_DATABASE_URL:-postgresql+asyncpg://postgres:changeme-postgres-password@postgres:5432/skill_registry}
    command: ["python", "-m", "scripts.seed_fixtures"]

  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://app_role:changeme-app-role-password@postgres:5432/skill_registry}
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  pgdata:
